kick-message: "&c&lAntiSpoof &r&7| &cClient bi cam: &e{client}\n&7Brand: &f{brand}\n&7Ly do: &f{reason}"
alert-message: "&8[&cAS&8] &e{player} &7-> &c{client} &7| Brand: &f{brand} | Ly do: &f{reason}"
check-delay-ticks: 40
log-enabled: true

vanilla-spoof-check: true
geyser-spoof-check: true
bedrock-prefix: "."

forge-consistency-check: true
fabric-consistency-check: true

vanilla-brand-patterns:
  - "^$"
  - "^vanilla$"
  - "^minecraft$"

safe-channels:
  - "^minecraft:.*"
  - "^bukkit:.*"
  - "^paper:.*"
  - "^bungeecord:.*"
  - "^velocity:.*"

forge-brand-patterns:
  - "(?i).*forge.*"

forge-required-channels:
  - "(?i).*(fml|forge).*"

fabric-brand-patterns:
  - "(?i).*fabric.*"

fabric-required-channels:
  - "(?i).*fabric.*"

